name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Runs only in the public repo, so private forks and mirrors spend no minutes.
    if: github.repository == 'nibforge/budgetline'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
